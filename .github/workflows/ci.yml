name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: mtai_test
          MYSQL_USER: mtai_test
          MYSQL_PASSWORD: mtai_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, dom, zip
          coverage: none
      
      - name: Install Dependencies
        run: composer install --no-progress --prefer-dist
      
      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate
      
      - name: Run Migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: mtai_test
          DB_USERNAME: mtai_test
          DB_PASSWORD: mtai_test
        run: php artisan migrate --force
      
      - name: Run Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: mtai_test
          DB_USERNAME: mtai_test
          DB_PASSWORD: mtai_test
        run: php artisan test
