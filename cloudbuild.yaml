steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/mtai-repo/mtai-app', '.']
    timeout: '1200s'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/mtai-repo/mtai-app']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy mtai-app \
          --image=us-central1-docker.pkg.dev/$PROJECT_ID/mtai-repo/mtai-app \
          --region=africa-south1 \
          --platform=managed \
          --allow-unauthenticated \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=5 \
          --set-env-vars=APP_NAME=M-TAI,APP_ENV=production,APP_DEBUG=false,APP_KEY=base64:f0IuYxIYZgNPEPZR91N2QosIxQcDRq5sFrW9IW+Pxic=,APP_URL=https://mtai-app-903291264005.africa-south1.run.app,DB_CONNECTION=mysql,DB_HOST=/cloudsql/project-83239cef-b08d-4558-b44:africa-south1:mtai-db,DB_PORT=3306,DB_DATABASE=mtai_production,DB_USERNAME=mtai_user,DB_PASSWORD=Mtai@2024Prod,RUN_MIGRATIONS=true,SESSION_DRIVER=database,SESSION_LIFETIME=120,CACHE_STORE=database,QUEUE_CONNECTION=database,SANCTUM_STATEFUL_DOMAINS=mtai-app-903291264005.africa-south1.run.app \
          --add-cloudsql-instances=project-83239cef-b08d-4558-b44:africa-south1:mtai-db
timeout: '1800s'
options:
  machineType: 'E2_HIGHCPU_8'
