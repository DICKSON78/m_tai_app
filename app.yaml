    secure: always

  - url: /.*
    script: auto
    secure: always

inbound_services:
  - warmup

automatic_scaling:
  min_idle_instances: 0
  max_idle_instances: 1
  min_pending_latency: automatic
  max_pending_latency: 30ms
  target_cpu_utilization: 0.65
  max_instances: 5
